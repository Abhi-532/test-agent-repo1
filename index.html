<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>
    <form id="expense-form">
      <input type="text" id="expense-name" placeholder="Expense Name" required />
      <input type="number" id="expense-amount" placeholder="Amount" min="0.01" step="0.01" required />
      <input type="date" id="expense-date" required />
      <button type="submit">Add Expense</button>
    </form>
    <h2>Expenses</h2>
    <table id="expenses-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Expenses will be dynamically inserted here -->
      </tbody>
    </table>
    <div class="summary">
      <strong>Total:</strong> $<span id="total-amount">0.00</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
